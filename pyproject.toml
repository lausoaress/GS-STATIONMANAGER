[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgm8"
version = "0.1.0"
description = "Ground Station Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0"]

# spacelab-tracking e o driver do Postgres não entram em `dependencies`: a
# primeira não está num índice de pacotes (é instalada de libs/ por caminho
# local, e caminhos relativos aqui não são portáveis com setuptools), e o
# segundo só é necessário para o TC Scheduler. Ver docker/Dockerfile.

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
zmq = ["pyzmq>=25,<26"]
scheduler = ["SQLAlchemy>=2.0,<3.0", "psycopg2-binary>=2.9"]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/spacelab-tracking/tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

# O painel do GRS Manager é servido de um template Jinja; sem isto ele não
# entra no wheel (só funcionaria em instalação editável).
[tool.setuptools.package-data]
grs_manager = ["status/templates/*.html"]

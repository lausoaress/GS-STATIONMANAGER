[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacelab-tracking"
version = "0.1.0"
description = "Propagação orbital SGP4 e previsão de passagens para a estação terrestre SpaceLab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sgp4>=2.23",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]
